spring:
  application:
    name: FoodWings

  datasource:
    url: ${DB_URL:jdbc:mysql://66.33.22.253:42672/railway?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:${MYSQLUSER:${SPRING_DATASOURCE_USERNAME:root}}}
    password: ${DB_PASSWORD:${MYSQLPASSWORD:${SPRING_DATASOURCE_PASSWORD:axRbyqzFeaIDkzDlnQeLfuvqdatMbjpM}}}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /

# ---------------------------------------------------------------------------
# Application specific configuration
# ---------------------------------------------------------------------------
foodwings:
  jwt:
    secret: ${JWT_SECRET:Zm9vZHdpbmdzLXN1cGVyLXNlY3JldC1rZXktZm9yLWp3dC1zaWduaW5nLTIwMjQtY2hhbmdlLW1l}
    access-token-expiration-ms: 3600000        # 1 hour
    refresh-token-expiration-ms: 604800000     # 7 days
  file:
    upload-dir: uploads
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_TLhzeABtIVO93X}
    key-secret: ${RAZORPAY_KEY_SECRET:O7GcVfHyjfXNtevQOJpjU1iI}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.springframework.security: INFO
    com.foodwings: DEBUG

---
# ===========================================================================
# Dev profile -- in-memory H2 so the application runs without a MySQL server
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# ===========================================================================
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:foodwings;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
