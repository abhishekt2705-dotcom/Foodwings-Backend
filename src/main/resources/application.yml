spring:
  application:
    name: FoodWings
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mysql}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /

# ---------------------------------------------------------------------------
# Application specific configuration
# ---------------------------------------------------------------------------
foodwings:
  jwt:
    # Base64 / plain secret used to sign JWT tokens. Override in production.
    secret: ${JWT_SECRET:Zm9vZHdpbmdzLXN1cGVyLXNlY3JldC1rZXktZm9yLWp3dC1zaWduaW5nLTIwMjQtY2hhbmdlLW1l}
    access-token-expiration-ms: 3600000        # 1 hour
    refresh-token-expiration-ms: 604800000     # 7 days
  file:
    upload-dir: uploads
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_TLhzeABtIVO93X}
    key-secret: ${RAZORPAY_KEY_SECRET:O7GcVfHyjfXNtevQOJpjU1iI}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.springframework.security: INFO
    com.foodwings: DEBUG

---
# ===========================================================================
# MySQL profile (default) -- tables are auto-generated by Hibernate
# ===========================================================================
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/foodwings?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

---
# ===========================================================================
# Dev profile -- in-memory H2 so the application runs without a MySQL server
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# ===========================================================================
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:foodwings;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
