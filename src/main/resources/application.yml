spring:
  application:
    name: FoodWings

  # Default: H2 in-memory database (works on Render free tier with zero config)
  # To use MySQL: set SPRING_PROFILES_ACTIVE=mysql + DB_URL/DB_USERNAME/DB_PASSWORD in Render env
  datasource:
    url: jdbc:h2:mem:foodwings;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=VALUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
      jakarta:
        persistence:
          jdbc:
            url: jdbc:h2:mem:foodwings;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=VALUE

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  h2:
    console:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

server:
  port: ${PORT:${SERVER_PORT:8080}}
  address: 0.0.0.0
  servlet:
    context-path: /
  tomcat:
    connection-timeout: 60000

# ---------------------------------------------------------------------------
# Application specific configuration
# ---------------------------------------------------------------------------
foodwings:
  jwt:
    secret: ${JWT_SECRET:Zm9vZHdpbmdzLXN1cGVyLXNlY3JldC1rZXktZm9yLWp3dC1zaWduaW5nLTIwMjQtY2hhbmdlLW1l}
    access-token-expiration-ms: 3600000        # 1 hour
    refresh-token-expiration-ms: 604800000     # 7 days
  file:
    upload-dir: uploads
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_TLhzeABtIVO93X}
    key-secret: ${RAZORPAY_KEY_SECRET:O7GcVfHyjfXNtevQOJpjU1iI}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.springframework.security: INFO
    com.foodwings: DEBUG
    com.zaxxer.hikari: WARN

---
# ===========================================================================
# MySQL profile -- use when a real MySQL/Railway DB is available
# Run with: -Dspring-boot.run.profiles=mysql
# ===========================================================================
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${DB_URL:jdbc:mysql://66.33.22.253:42672/railway?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectTimeout=5000&socketTimeout=10000}
    username: ${DB_USERNAME:${MYSQLUSER:root}}
    password: ${DB_PASSWORD:${MYSQLPASSWORD:axRbyqzFeaIDkzDlnQeLfuvqdatMbjpM}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update

---
# ===========================================================================
# Dev profile -- in-memory H2 so the application runs without any DB server
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# ===========================================================================
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:foodwings;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=VALUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
